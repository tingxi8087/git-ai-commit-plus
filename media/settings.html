<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
  <title>AI Commit</title>
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
  <main>
    <header><strong>AI Commit</strong><span class="version">{{version}}</span></header>
    <nav role="tablist" aria-label="功能">
      <button id="tab-config" type="button" role="tab" aria-selected="true" aria-controls="panel-config">配置</button>
      <button id="tab-usage" type="button" role="tab" aria-selected="false" aria-controls="panel-usage" tabindex="-1">用量</button>
    </nav>
    <section id="panel-config" role="tabpanel" aria-labelledby="tab-config">
      <form id="settings-form">
        <div class="grid">
          <div><label for="provider">来源</label><select id="provider" disabled></select></div>
          <div><label for="model">模型</label><select id="model" disabled></select></div>
        </div>
        <div class="field">
          <label for="api-key">API Key <span id="key-state" class="muted">未配置</span></label>
          <div class="key-row"><input id="api-key" type="password" placeholder="输入密钥" autocomplete="off" spellcheck="false" maxlength="512" title="安全存储；留空保留已有密钥" disabled><button id="test" type="button" class="secondary" disabled>测试</button><button id="clear-key" type="button" class="secondary" disabled>清除</button></div>
        </div>
        <div class="grid">
          <div><label for="language">提交语言</label><select id="language" disabled><option value="zh-CN">简体中文</option><option value="en">English</option></select></div>
          <div><label for="scope">变更范围</label><select id="scope" disabled><option value="auto">优先暂存，否则全部</option><option value="staged">仅暂存</option><option value="all">全部变更</option></select></div>
        </div>
        <fieldset><legend>详细程度</legend><div class="segments">
          <label><input type="radio" name="detail" value="concise" checked disabled><span>简洁</span></label>
          <label><input type="radio" name="detail" value="standard" disabled><span>标准</span></label>
          <label><input type="radio" name="detail" value="detailed" disabled><span>详细</span></label>
        </div></fieldset>
        <div class="actions"><button id="save" type="submit" class="primary" disabled>保存</button><span id="config-status" role="status" aria-live="polite">加载中…</span></div>
        <p class="note">变更与近期提交标题发送至 DeepSeek · 密钥安全存储</p>
      </form>
    </section>
    <section id="panel-usage" role="tabpanel" aria-labelledby="tab-usage" hidden>
      <div class="usage-toolbar"><span id="usage-total" class="muted">暂无用量</span><button id="refresh" type="button" class="secondary">刷新</button></div>
      <div class="table-scroll" tabindex="0" role="region" aria-label="各模型 Token 用量">
        <table id="usage-table" hidden>
          <thead><tr><th>模型</th><th>调用</th><th>输入</th><th>缓存命中</th><th>未命中</th><th title="API 未上报缓存明细的输入 Token">未分类</th><th>输出</th><th>合计</th></tr></thead>
          <tbody id="usage-rows"></tbody>
          <tfoot id="usage-sum"></tfoot>
        </table>
      </div>
      <div id="usage-empty" class="empty">暂无用量</div>
      <p class="note" title="按 API 返回的 usage 累计；未返回用量的失败或取消请求无法计入。输出已包含推理 Token（若有），不重复相加。缓存命中和未命中是输入的组成部分，不额外计入合计。">本机累计 · 含连接测试 · 未上报用量不计入 Token</p>
      <span id="usage-status" role="status" aria-live="polite"></span>
    </section>
  </main>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
